name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: pnpm run typecheck
      - run: pnpm run test

  package-windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\cache
            ~\AppData\Local\electron-builder\cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build canonical DAEMON installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm run package:lite
      - name: Packaged smoke
        shell: pwsh
        run: |
          node scripts/smoke/lite-app-smoke.mjs
          node scripts/smoke/lite-workbench-smoke.mjs
      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-lite -Recurse -File -Filter DAEMON-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'DAEMON-setup.exe was not produced' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath release-lite/checksums-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: daemon-windows-release
          path: |
            release-lite/*/DAEMON-setup.exe
            release-lite/*/DAEMON-setup.exe.blockmap
            release-lite/*/latest.yml
            release-lite/checksums-windows.txt
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: package-windows
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: daemon-windows-release
          path: artifacts/windows
      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo '## DAEMON focused workbench' > changelog.md
          echo '' >> changelog.md
          echo '- Conversation-first Solana development shell' >> changelog.md
          echo '- Project explorer, offline Monaco editor, and scoped terminal' >> changelog.md
          echo '- Meme Tech repo intelligence and read-only market evidence' >> changelog.md
          echo '- Guarded localnet/devnet workflows with no silent mainnet authority' >> changelog.md
          echo '' >> changelog.md
          echo '## Changes' >> changelog.md
          git log --pretty=format:'- %s (%h)' "$PREV_TAG"..HEAD >> changelog.md
          echo '' >> changelog.md
          echo '' >> changelog.md
          echo '## SHA-256' >> changelog.md
          echo '```' >> changelog.md
          cat artifacts/windows/checksums-windows.txt >> changelog.md
          echo '```' >> changelog.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          files: |
            artifacts/windows/*/DAEMON-setup.exe
            artifacts/windows/*/DAEMON-setup.exe.blockmap
            artifacts/windows/*/latest.yml
            artifacts/windows/checksums-windows.txt
